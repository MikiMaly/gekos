name = "gekos-cron"
main = "src/index.ts"
compatibility_date = "2025-01-15"

# Každých 5 minut. Handler uvnitř větví podle Prague-local hour+minute,
# takže DST přechody nic neposunou (cron je UTC, Prague offset uvnitř).
[triggers]
crons = ["*/5 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "gekos"
database_id = "259436bf-1981-400d-9095-672ce0f429e5"
migrations_dir = "../migrations"

# Secrets (nastav přes `wrangler secret put`):
#   BOT_TOKEN                 — Telegram bot token
#   TELEGRAM_CHAT_ID          — chat_id příjemce
#   TELEGRAM_WEBHOOK_SECRET   — random string, musí odpovídat secret_token
#                                v setWebhook (chrání /telegram endpoint)
